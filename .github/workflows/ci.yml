name: Omni CI (Monolith, 8-Crate Workspace & Version-Locked Harness Selftests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run standalone monolith selftest (248 checks + Stage-1/Stage-2 ELF64 fixed point + harness & agent-driver contract)
        run: |
          rustc -O omni_rust_bootstrap.rs -o omni
          ./omni selftest
          ./omni harness --spec
          ./omni harness --version-check
          ./omni agent-driver --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25

      - name: Build and run 8-crate Cargo workspace differential selftest (209/210 checks + omni-harness & omni-agent-driver binaries)
        working-directory: omni-workspace/omni-workspace
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build --workspace
          cargo run -p omni-cli -- selftest
          cargo run -p omni-cli --bin omni-harness -- --spec
          cargo run -p omni-cli --bin omni-agent-driver -- --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25
