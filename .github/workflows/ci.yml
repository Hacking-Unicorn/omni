name: Omni CI (Monolith, 8-Crate Workspace & Version-Locked Harness Selftests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run standalone monolith selftest (fixed-point + M2 lint/elf + 4-backend diff + pure-omni-diff + acceptance-diff + harness)
        run: |
          rustc -O omni_rust_bootstrap.rs -o omni
          ./omni fixed-point
          ./omni m2-lint
          ./omni m2-elf
          ./omni m2-compile
          ./omni m2-multi
          ./omni m2-multi-pure
          ./omni m2-wasm-multi
          ./omni m2-verify
          ./omni m2-fixed-point
          ./omni m3-gate
          ./omni m3-lower
          ./omni m3-lockstep
          ./omni m3-4backend
          ./omni m3-fixed-point
          ./omni backend-diff --suite
          ./omni selftest
          ./omni pure-bootstrap
          ./omni pure-omni-diff
          ./omni acceptance-diff
          ./omni harness --spec
          ./omni harness --version-check
          ./omni agent-driver --list-strategies
          ./omni agent-driver --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25

      - name: Build and run 8-crate Cargo workspace differential selftest (--release + cargo test)
        working-directory: omni-workspace
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo build --release --workspace
          cargo run --release -p omni-cli -- selftest
          cargo run --release -p omni-cli -- pure-bootstrap
          cargo run --release -p omni-cli -- pure-omni-diff
          cargo run --release -p omni-cli -- acceptance-diff
          cargo run --release -p omni-cli --bin omni-harness -- --spec
          cargo run --release -p omni-cli --bin omni-agent-driver -- --list-strategies
          cargo run --release -p omni-cli --bin omni-agent-driver -- --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25
          cargo test --release --workspace
