name: Omni CI (Monolith, 8-Crate Workspace & Version-Locked Harness Selftests)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run standalone monolith selftest (fixed-point + M2/M3/P4/P5 gates + 4-backend diff + pure-omni-diff + acceptance-diff + harness)
        run: |
          rustc -O omni_rust_bootstrap.rs -o omni
          ./omni --help
          ./omni fixed-point
          ./omni pure-bootstrap
          ./omni m2-lint
          ./omni m2-elf
          ./omni m2-lock > /tmp/m2_lock_check.tsv && diff -u spec/m2/single_mode_lock.tsv /tmp/m2_lock_check.tsv
          ./omni m2-compile
          ./omni m2-multi
          ./omni m2-multi-pure
          ./omni m2-wasm-multi
          ./omni m2-verify
          ./omni m2-fixed-point
          ./omni m3-gate
          ./omni m3-lex
          ./omni m3-skim
          ./omni m3-expr
          ./omni m3-stmt
          ./omni m3-lower
          ./omni m3-lockstep
          ./omni m3-4backend
          ./omni m3-fixed-point
          ./omni p4-vm
          ./omni p4-shim
          ./omni p4-wasm
          ./omni compile-surface --rust spec/acceptance/goldens/seed6_clamp.omni /tmp/seed6_clamp.omni_bc
          ./omni p4-exec /tmp/seed6_clamp.omni_bc 150 10 90 --trace
          ./omni p5-sys
          ./omni p5-selfhost
          ./omni p7-measure
          ./omni p7-canary
          ./omni p7-heal
          ./omni p7-adapt
          ./omni p7-learn
          ./omni a1-pure-default
          ./omni api-stage1
          ./omni api-stage2
          ./omni api-stage2-emit
          ./omni api-stage2-5
          ./omni backend-diff --suite
          ./omni selftest
          ./omni pure-omni-diff
          ./omni acceptance-diff
          ./omni harness --spec
          ./omni harness --version-check
          ./omni agent-driver --list-strategies
          ./omni agent-driver --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25

      - name: Build and run 8-crate Cargo workspace differential selftest (--release + cargo test)
        working-directory: omni-workspace
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo check --release -p omni-aot
          cargo build --release --workspace
          cargo run --release -p omni-cli -- --help
          cargo run --release -p omni-cli -- selftest
          cargo run --release -p omni-cli -- pure-bootstrap
          cargo run --release -p omni-cli -- pure-omni-diff
          cargo run --release -p omni-cli -- acceptance-diff
          cargo run --release -p omni-cli --bin omni-harness -- --spec
          cargo run --release -p omni-cli --bin omni-agent-driver -- --list-strategies
          cargo run --release -p omni-cli --bin omni-agent-driver -- --strict "fn main(a: int) -> trit { let d = a - 10; let g = egate(d); return g; }" 25
          cargo test --release --workspace
