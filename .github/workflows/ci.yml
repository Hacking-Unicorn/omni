name: Omni CI (Zero-Rust Pure-Omni Clean-Room Gate)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  zero-rust-clean-room:
    name: Zero-Rust Clean-Room Rebuild & Pure-Omni Harness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify zero Rust/Cargo files in tree and no rustc/cargo on PATH
        run: |
          export PATH="/usr/bin:/bin"
          echo "PATH=$PATH"
          ! command -v rustc
          ! command -v cargo
          test "$(find . -path ./.git -prune -o \( -name '*.rs' -o -name 'Cargo.toml' -o -name 'Cargo.lock' \) -print | wc -l)" -eq 0

      - name: Run mandatory Zero-Rust Clean-Room Rebuild & Fixed-Point Gate
        run: |
          PATH="/usr/bin:/bin" bash scripts/zero_rust_rebuild.sh

      - name: Run Pure-Omni Driver Verification Suite (Step 7)
        run: |
          PATH="/usr/bin:/bin" bash scripts/verify_step7_driver.sh

      - name: Run Pure-Omni Harness Verification Suite (Step 8)
        run: |
          PATH="/usr/bin:/bin" bash scripts/verify_step8_harness.sh

  external-verifier:
    name: Independent External Verifier Trace Check (C2 — Python 3, zero Rust/Omni)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run independent verifier trace checker
        run: |
          python3 scripts/external_verifier_check.py
